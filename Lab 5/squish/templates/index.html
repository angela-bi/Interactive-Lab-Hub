<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Hand/Face Stream</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: Arial, Helvetica, sans-serif; display:flex; flex-direction:column; align-items:center; padding:16px; }
    #stream { border: 4px solid #444; max-width: 100%; width: 640px; height: auto; }
    .controls { margin-top: 12px; display:flex; gap:8px; }
    button { padding:8px 12px; font-size:16px; }
    .note { margin-top:8px; color:#666; font-size:14px; }
  </style>
</head>
<body>
  <h2>Hand + Face Processing Live Stream</h2>
  <img id="stream" src="{{ url_for('video_feed') }}" alt="Live stream" />
  <div class="controls">
    <button id="startAudio">Start Audio</button>
    <button id="stopAudio">Stop Audio</button>
  </div>
  <div class="note">Press Ctrl+C in the terminal running <code>app.py</code> to stop the server.</div>

  <script>
    document.getElementById('startAudio').addEventListener('click', async () => {
      await fetch('/audio/start', { method: 'POST' });
    });
    document.getElementById('stopAudio').addEventListener('click', async () => {
      await fetch('/audio/stop', { method: 'POST' });
    });
  </script>
</body>
</html>
