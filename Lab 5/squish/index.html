<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Hand + Face Squish Effect</title>
<style>
  body { margin: 0; overflow: hidden; }
  video, canvas {
    position: absolute; top: 0; left: 0;
    width: 640px; height: 480px;
    transform: scaleX(-1); /* mirror */
  }
  canvas { z-index: 10; }
</style>
</head>
<body>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<script async src="https://docs.opencv.org/4.x/opencv.js" onload="onOpenCvReady();"></script>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let cap, ready = false;
let hands, faceMesh;

let handLandmarks = null;
let faceLandmarks = null;

let pTime = performance.now();
let src = null;

function onOpenCvReady() {
  console.log('OpenCV.js ready');
  ready = true;
  if (hands && faceMesh) start();
}

async function startCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
  video.srcObject = stream;
  await new Promise(resolve => video.onloadedmetadata = resolve);
}

async function waitForVideoSize() {
  return new Promise((resolve) => {
    if (video.videoWidth > 0 && video.videoHeight > 0) {
      resolve();
    } else {
      video.onloadedmetadata = () => resolve();
    }
  });
}

function distance(x1, y1, x2, y2) {
  return Math.hypot(x2 - x1, y2 - y1);
}

// Initialize MediaPipe Hands
hands = new Hands({
  locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});
hands.setOptions({
  maxNumHands: 1,
  minDetectionConfidence: 0.7,
  minTrackingConfidence: 0.7
});
hands.onResults(results => {
  handLandmarks = results.multiHandLandmarks && results.multiHandLandmarks.length ? results.multiHandLandmarks[0] : null;
});

// Initialize MediaPipe Face Mesh
faceMesh = new FaceMesh({
  locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
});
faceMesh.setOptions({
  maxNumFaces: 1,
  refineLandmarks: true,
  minDetectionConfidence: 0.7,
  minTrackingConfidence: 0.7
});
faceMesh.onResults(results => {
  faceLandmarks = results.multiFaceLandmarks && results.multiFaceLandmarks.length ? results.multiFaceLandmarks[0] : null;
});

async function start() {
  await startCamera();
  await waitForVideoSize();

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  cap = new cv.VideoCapture(video);
  src = new cv.Mat(video.videoHeight, video.videoWidth, cv.CV_8UC4);

  requestAnimationFrame(processFrame);
}

function getFaceBoundingBox(landmarks) {
  const xs = landmarks.map(l => l.x * canvas.width);
  const ys = landmarks.map(l => l.y * canvas.height);
  const xMin = Math.min(...xs);
  const xMax = Math.max(...xs);
  const yMin = Math.min(...ys);
  const yMax = Math.max(...ys);
  return { x: xMin, y: yMin, w: xMax - xMin, h: yMax - yMin };
}

function processFrame() {
  if (!ready) {
    requestAnimationFrame(processFrame);
    return;
  }

  // Send video frame to MediaPipe
  hands.send({ image: video });
  faceMesh.send({ image: video });

  // Capture frame from video for OpenCV processing
  cap.read(src);

  // Flip horizontally (mirror)
  cv.flip(src, src, 1);

  // Draw hands landmarks for debug
  if (handLandmarks) {
    for (const lm of handLandmarks) {
      let x = Math.floor(lm.x * canvas.width);
      let y = Math.floor(lm.y * canvas.height);
      cv.circle(src, new cv.Point(x, y), 8, [255, 0, 255, 255], -1);
    }
  }

  if (faceLandmarks) {
    let { x, y, w, h } = getFaceBoundingBox(faceLandmarks);

    x = Math.max(0, Math.floor(x));
    y = Math.max(0, Math.floor(y));
    w = Math.min(canvas.width - x, Math.floor(w));
    h = Math.min(canvas.height - y, Math.floor(h));

    // Draw face box
    cv.rectangle(src, new cv.Point(x, y), new cv.Point(x + w, y + h), [0, 255, 255, 255], 2);

    if (handLandmarks) {
      // Thumb tip (landmark 4) and index tip (landmark 8) from MediaPipe Hands
      let thumb = handLandmarks[4];
      let index = handLandmarks[8];

      const thumbX = thumb.x * canvas.width;
      const thumbY = thumb.y * canvas.height;
      const indexX = index.x * canvas.width;
      const indexY = index.y * canvas.height;
      const cx = (thumbX + indexX) / 2;
      const cy = (thumbY + indexY) / 2;

      // Draw pinch points & line
      cv.circle(src, new cv.Point(thumbX, thumbY), 10, [255, 0, 255, 255], -1);
      cv.circle(src, new cv.Point(indexX, indexY), 10, [255, 0, 255, 255], -1);
      cv.line(src, new cv.Point(thumbX, thumbY), new cv.Point(indexX, indexY), [255, 0, 255, 255], 3);
      cv.circle(src, new cv.Point(cx, cy), 10, [255, 0, 255, 255], -1);

      const length = distance(thumbX, thumbY, indexX, indexY);

      // Check if face is between thumb and index X positions (with margin)
      const margin = 10;
      const inside = (x - margin < indexX && indexX < x + w + margin) && (x - margin < thumbX && thumbX < x + w + margin);

      if (inside) {
        // Write text on screen
        cv.putText(src, 'FACE BETWEEN FINGERS!', new cv.Point(40, 100), cv.FONT_HERSHEY_SIMPLEX, 1, [0, 255, 0, 255], 3);

        // Extract face ROI and squish it
        let faceROI = src.roi(new cv.Rect(x, y, w, h));

        let squishFactor = 1 - (length - 50) / 250; // map distance to 0.4-1
        squishFactor = Math.min(1.0, Math.max(0.4, squishFactor));

        let newW = Math.round(w / squishFactor);
        let newH = Math.round(h * squishFactor);

        let squished = new cv.Mat();
        cv.resize(faceROI, squished, new cv.Size(newW, newH), 0, 0, cv.INTER_AREA);

        let finalSquish = new cv.Mat();
        cv.resize(squished, finalSquish, new cv.Size(w, h), 0, 0, cv.INTER_AREA);

        finalSquish.copyTo(src.roi(new cv.Rect(x, y, w, h)));

        faceROI.delete();
        squished.delete();
        finalSquish.delete();
      }

      // Visual cue if pinch length < 50
      if (length < 50) {
        cv.circle(src, new cv.Point(cx, cy), 15, [0, 255, 0, 255], -1);
      }
    }
  }

  // FPS calculation
  let cTime = performance.now();
  let fps = 1000 / (cTime - pTime);
  pTime = cTime;
  cv.putText(src, `FPS: ${fps.toFixed(1)}`, new cv.Point(40, 50), cv.FONT_HERSHEY_SIMPLEX, 1, [255, 0, 0, 255], 3);

  cv.imshow('canvas', src);

  requestAnimationFrame(processFrame);
}
start();
</script>
</body>
</html>
