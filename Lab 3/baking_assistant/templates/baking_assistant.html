<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baking Assistant - Lab 3</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <style>
      /* edited by hand with advice from chatGPT */
        * {
          font-family: 'Inter', sans-serif;
          font-weight: 200;
          font-style: normal;
        }

        body {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: whitesmoke;
            min-height: 100vh;
            color: rgb(104, 102, 102);
        }
        
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
        }
        
        .chat-container {
            height: 400px;
            overflow-y: auto;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        /* edited by hand with advice from chatGPT */
        .message {
            margin-bottom: 15px;
            padding: 10px 15px;
            border-radius: 10px;
            line-height: 1.4;
            display: block;
            width: fit-content; 
            max-width: 70%;
            word-wrap: break-word;
        }
        
        /* edited by hand with advice from chatGPT */
        .user-message {
            background: rgba(100, 200, 255, 0.3);
            margin-left: auto;
            margin-right: 0;
            text-align: left;
        }
        
        /* edited by hand with advice from chatGPT */
        .ai-message {
            background: rgba(212, 211, 207, 0.3);
            margin-right: 50px;
            text-align: left;
        }
        
        .input-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        #messageInput {
            flex: 1;
            padding: 15px;
            border: 1px solid rgb(104, 102, 102);
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.2);
            color: rgb(104, 102, 102);
            font-size: 16px;
            backdrop-filter: blur(10px);
        }
        
        #messageInput::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }
        
        .btn {
            padding: 15px 25px;
            border: 1px solid rgb(104, 102, 102);
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.2);
            color: rgb(104, 102, 102);
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        
        .btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 20px;
        }
        
        .status {
            text-align: center;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 20px;
            /* font-weight: bold; */
        }
        
        .status.connected {
            background: rgba(0, 255, 0, 0.2);
        }
        
        .status.disconnected {
            background: rgba(255, 0, 0, 0.2);
        }
        
        .thinking {
            text-align: center;
            font-style: italic;
            color: rgba(186, 181, 165, 0.8);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧁 Your Own Baking Assistant!</h1>
        
        <div id="status" class="status disconnected">
          Connecting to Ollama...
        </div>
        
        <div id="chatContainer" class="chat-container">
          <div class="message ai-message">
            Hello! To get started, paste a recipe here!
          </div>
          <div id="inputContainer" class="input-container">
            <input type="text" id="messageInput" placeholder="Put your recipe here..." />
            <button class="btn" onclick="sendRecipe()">Send</button>
          </div>
          <!-- <div class="message ai-message">
            👋 Hello! I'm your Ollama-powered voice assistant. Type a message or use the voice features below!
          </div> -->
        </div>
        
        <!-- <div class="input-container">
            <input type="text" id="messageInput" placeholder="Type your message here..." />
            <button class="btn" onclick="sendMessage()">Send</button>
        </div> -->
        
        <div class="controls">
            <button class="btn" onclick="startRecording()">🎙️ Record</button>
            <!-- <button class="btn" onclick="sendVoiceMessage()">🎤 Voice Chat</button>
            <button class="btn" onclick="speakLastResponse()">🔊 Speak Last</button>
            <button class="btn" onclick="clearChat()">🗑️ Clear Chat</button> -->
            <!-- <button class="btn" onclick="checkStatus()">📊 Status</button> -->
        </div>
    </div>

    <script>
        // WebSocket connection
        const socket = io();
        let lastResponse = '';
        
        // DOM elements
        const chatContainer = document.getElementById('chatContainer');
        const messageInput = document.getElementById('messageInput');
        const statusDiv = document.getElementById('status');
        
        // Check Ollama status on load
        checkStatus();
        
        // Socket event handlers
        socket.on('connect', function() {
            console.log('Connected to server');
        });
        
        socket.on('ai_response', function(data) {
            addMessage(data.user_message, 'user');
            addMessage(data.ai_response, 'ai');
            lastResponse = data.ai_response;
            hideThinking();

            socket.emit('speak_request', { text: data.ai_response });
            console.log('speak request sent')
        });
        
        socket.on('voice_response', function(data) {
            addMessage(data.user_message + ' 🎤', 'user');
            addMessage(data.ai_response + ' 🔊', 'ai');
            lastResponse = data.ai_response;
            hideThinking();
        });
        
        socket.on('speak_complete', function(data) {
            console.log('Speech completed:', data.text);
        });
        
        // Functions

        // modified by chatGPT
        function sendRecipe() {
            const message = messageInput.value.trim();
            if (message) {
              // Check if message looks like a link
              const urlPattern = /(https?:\/\/[^\s]+)/g;
              if (!urlPattern.test(message)) {
                  addMessage(message, 'user');
                  const ai_message = "⚠️ Please provide a valid recipe link (starting with http:// or https://)."
                  addMessage(ai_message, 'ai');
                  // socket.emit('speak_request', { text: ai_message })
                  messageInput.value = '';
                  document.getElementById('inputContainer').style.display = 'none';
                  return;
              }
                showThinking();
                socket.emit('chat_message', { message: message });
                // console.log(lastResponse)
                // socket.emit('speak_request', { text: lastResponse })
                messageInput.value = '';
                document.getElementById('inputContainer').style.display = 'none';
            }
        }
        
        
        // generated by chatGPT
        function addMessage(text, type) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}-message`;
            messageDiv.innerHTML = text   // instead of textContent
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        
        function showThinking() {
            const thinkingDiv = document.createElement('div');
            thinkingDiv.className = 'thinking';
            thinkingDiv.id = 'thinking';
            thinkingDiv.textContent = '🧠 Thinking...';
            chatContainer.appendChild(thinkingDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
        
        function hideThinking() {
            const thinkingDiv = document.getElementById('thinking');
            if (thinkingDiv) {
                thinkingDiv.remove();
            }
        }
        
        function clearChat() {
            chatContainer.innerHTML = '<div class="message ai-message">👋 Chat cleared! How can I help you?</div>';
            lastResponse = '';
        }

        let mediaRecorder;
        let audioChunks = [];

        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        audioChunks.push(event.data);
                    }
                };

                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });  // WAV instead of webm
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        const base64data = reader.result.split(',')[1];
                        socket.emit('voice_recording', { audio: base64data });
                        showThinking();
                    };
                    reader.readAsDataURL(audioBlob);
                };

                mediaRecorder.start();
                console.log("microphone started")
                setTimeout(() => {
                    mediaRecorder.stop();
                }, 5000); // stop after 5 seconds
                console.log("microphone stopped")
            } catch (err) {
                alert("Microphone access denied or not available.");
                console.error(err);
            }
        }

        
        async function checkStatus() {
            try {
                const response = await fetch('/status');
                const data = await response.json();
                
                if (data.status === 'connected') {
                    statusDiv.className = 'status connected';
                    statusDiv.textContent = `✅ Connected to Ollama (Model: ${data.current_model})`;
                } else {
                    statusDiv.className = 'status disconnected';
                    statusDiv.textContent = `❌ ${data.message}`;
                }
            } catch (error) {
                statusDiv.className = 'status disconnected';
                statusDiv.textContent = '❌ Cannot connect to server';
            }
        }
        
        // Enter key to send message
        messageInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendRecipe();
            }
        });
        
        // Auto-focus input
        messageInput.focus();
    </script>
</body>
</html>
